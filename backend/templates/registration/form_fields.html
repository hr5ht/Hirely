<form method="post" class="auth-form stack">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
    <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
        {% if field.help_text %}<div class="helptext">{{ field.help_text|safe }}</div>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary btn-block">{{ submit_label }}</button>
</form>
