{% load static %}
<nav class="nav">
    <div class="container nav-inner">
        <div class="row">
            <a href="/dashboard/" class="brand">
                <img src="{% static 'ai_engine/logo.svg' %}" alt="">
                <span>Hirely</span>
            </a>
            <div class="segmented" role="navigation" aria-label="Main">
                <a href="/dashboard/" {% if request.path == '/dashboard/' %}aria-current="page"{% endif %}>Dashboard</a>
                {% if user.profile.role != 'recruiter' %}
                <a href="/scores/" {% if request.path == '/scores/' %}aria-current="page"{% endif %}>Scores</a>
                <a href="/profile/" {% if request.path == '/profile/' %}aria-current="page"{% endif %}>Profile</a>
                {% endif %}
            </div>
        </div>
        <div class="nav-right">
            {% if user.profile.role == 'recruiter' %}
            <span class="badge hide-sm"><span class="dot dot-blue"></span>{{ user.profile.company.name }}</span>
            {% else %}
            <span class="badge hide-sm"><span class="dot dot-green dot-live"></span>{{ user.username }}</span>
            {% endif %}
            <a href="/logout/" class="btn btn-secondary btn-sm">Log out</a>
        </div>
    </div>
</nav>
