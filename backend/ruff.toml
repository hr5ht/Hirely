line-length = 130
extend-exclude = ["venv", "ai_engine/migrations"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long prompt strings read better unwrapped
    "B905",  # zip() over different lengths is intentional (pairs, sliding windows)
]

[lint.isort]
known-first-party = ["ai_engine", "backend"]
