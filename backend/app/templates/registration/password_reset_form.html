{% extends "registration/auth_card.html" %}
{% block heading %}Reset your password{% endblock %}
{% block card %}
<p class="muted small center">Enter your account's email and we'll send you a link to choose a new password.</p>
<form method="post" class="auth-form stack">
    {{ csrf_input }}
    <div class="field">
        <label for="id_email">Email</label>
        <input type="email" name="email" id="id_email" class="input" autocomplete="email" maxlength="254" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
</form>
{% endblock %}
